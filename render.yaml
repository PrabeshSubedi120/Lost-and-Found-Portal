services:
  - type: web
    name: lostfound-portal
    env: python
    plan: free
    buildCommand: pip install -r requirements_production.txt
    startCommand: gunicorn lostfound_project.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DJANGO_SETTINGS_MODULE
        value: lostfound_project.settings_production
      - key: DATABASE_URL
        fromDatabase:
          name: lostfound-db
          property: connectionString

databases:
  - name: lostfound-db
    databaseName: lostfound_db
    user: lostfound_user
    plan: free
